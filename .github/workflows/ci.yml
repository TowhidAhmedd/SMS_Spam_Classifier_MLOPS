


# cat > /home/claude/Spam_prediction/.github/workflows/ci.yml << 'EOF'
name: CI/CD — Lint, Test, Docker Build & Deploy to Render

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint + Test ─────────────────────────────────────────
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       spam_db
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:        postgresql://postgres:postgres@localhost:5432/spam_db
      MODEL_PATH:          models/spam_classifier.joblib
      MLFLOW_TRACKING_URI: mlruns
      SENTRY_DSN:          ""
      RETRAIN_THRESHOLD:   "50"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint with ruff
        run: ruff check src/ app.py tests/ --ignore E501

      - name: Create dummy model for tests
        run: |
          mkdir -p models data
          python -c "
          import joblib, json, os
          from sklearn.pipeline import Pipeline
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.linear_model import LogisticRegression
          p = Pipeline([('tfidf', TfidfVectorizer()), ('clf', LogisticRegression())])
          p.fit(['hello world', 'win free money now', 'meeting tomorrow', 'click here prize'], [0, 1, 0, 1])
          os.makedirs('models', exist_ok=True)
          joblib.dump(p, 'models/spam_classifier.joblib')
          json.dump({'accuracy': 0.99, 'f1': 0.99, 'best_f1': 0.99}, open('models/metadata.json','w'))
          "

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=app --cov-report=term-missing

  # ── Job 2: Docker Build ────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for model creation
        run: |
          python -m pip install --upgrade pip
          pip install joblib scikit-learn

      - name: Create dummy model for Docker build
        run: |
          mkdir -p models
          python -c "
          import joblib, json
          from sklearn.pipeline import Pipeline
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.linear_model import LogisticRegression
          p = Pipeline([('tfidf', TfidfVectorizer()), ('clf', LogisticRegression())])
          p.fit(['hello', 'spam prize'], [0, 1])
          joblib.dump(p, 'models/spam_classifier.joblib')
          json.dump({'best_f1': 0.99}, open('models/metadata.json','w'))
          "

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: spam-classifier:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Render ────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY:    ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Wait and verify deployment
        env:
          RENDER_API_KEY:    ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Waiting for Render deployment..."
          sleep 30
          for i in {1..20}; do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=1" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['status'])" 2>/dev/null)
            echo "Deploy Status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "✅ Deployment successful!"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "❌ Deployment failed!"
              exit 1
            fi
            sleep 15
          done
          echo "⚠️ Deployment timed out"
          exit 1









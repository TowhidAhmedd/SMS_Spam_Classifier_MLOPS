databases:
  - name: spam-classifier-db
    plan: free
    region: oregon
    databaseName: spam_db
    user: spam_user

services:
  - type: web
    name: spam-classifier-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spam-classifier-db
          property: connectionString

      - key: MLFLOW_TRACKING_URI
        sync: false   # set manually in Render dashboard

      - key: MLFLOW_TRACKING_USERNAME
        sync: false

      - key: MLFLOW_TRACKING_PASSWORD
        sync: false

      - key: SENTRY_DSN
        sync: false

      - key: PORT
        value: "8000"

      - key: RETRAIN_THRESHOLD
        value: "50"
